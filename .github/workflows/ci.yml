name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: Risk Engine coverage gate
        run: >
          uv run pytest tests/test_risk.py tests/test_sizing.py
          --cov=aqt.risk --cov=aqt.sizing --cov-fail-under=95 -q
      - name: Research CLI smoke test
        run: uv run python -m services.research.cli run --strategy breakout --bars 1200 --out /tmp/reports

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
